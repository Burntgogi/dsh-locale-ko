# dsh-locale-ko bundle patch: inserts the locale pack row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field). Activate with:
#   dsh plugin --profile web add github:Burntgogi/dsh-locale-ko
- insert:
    - id: locale-pack
      name: 'dsh-locale-ko'
